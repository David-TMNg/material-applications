services:
  watchtower:
    image: nickfedor/watchtower
    environment:
      -  WATCHTOWER_POLL_INTERVAL=60 <em># Poll every 60 seconds</em>
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: express-app
    container_name: watchtower
  express-app:
    image: davidtmng/express-app
    ports: 
      - 8080:8080
    container_name: express-app

